name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # ── Linux ──────────────────────────────────────────────────────────────
      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libcurl4-openssl-dev \
            libssl-dev \
            libmicrohttpd-dev

      # ── macOS ──────────────────────────────────────────────────────────────
      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        timeout-minutes: 10
        run: |
          brew install cmake curl openssl libmicrohttpd

      # ── Windows (ucrt64 via pre-installed MSYS2) ──────────────────────────
      - name: Set up ucrt64 (Windows)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 10
        shell: bash
        run: |
          C:/msys64/usr/bin/pacman -S --noconfirm --needed \
            mingw-w64-ucrt-x86_64-gcc \
            mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-make \
            mingw-w64-ucrt-x86_64-curl \
            mingw-w64-ucrt-x86_64-openssl
          echo "C:/msys64/ucrt64/bin" >> "$GITHUB_PATH"

      # ── Build (Makefile — Linux/macOS only) ───────────────────────────────
      - name: Build library with Make
        if: matrix.os != 'windows-latest'
        timeout-minutes: 10
        run: make lib

      - name: Run C tests (Make)
        if: matrix.os != 'windows-latest'
        timeout-minutes: 20
        run: make c-test

      # ── Build (CMake — all platforms) ─────────────────────────────────────
      - name: Configure CMake build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        timeout-minutes: 10
        run: cmake -S . -B build-cmake -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF

      - name: Configure CMake build (Windows)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 10
        shell: bash
        run: cmake -S . -B build-cmake -G "MinGW Makefiles" -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF

      - name: Build with CMake
        timeout-minutes: 10
        run: cmake --build build-cmake --parallel

      - name: Run CMake tests
        timeout-minutes: 10
        run: ctest --test-dir build-cmake --output-on-failure --parallel --timeout 120

      # ── Python wheel ───────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install Python package (Linux/macOS)
        if: matrix.os != 'windows-latest'
        timeout-minutes: 10
        run: python -m pip install ./python

      - name: Install Python package (Windows)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 10
        shell: bash
        env:
          CMAKE_GENERATOR: "MinGW Makefiles"
        run: |
          python -m pip install delvewheel build
          python -m build --wheel ./python --outdir /tmp/wheels
          python -m delvewheel repair /tmp/wheels/gigavector*.whl -w /tmp/repaired
          python -m pip install /tmp/repaired/gigavector*.whl

      - name: Run Python tests
        timeout-minutes: 10
        shell: pwsh
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          # Stream output live (Tee-Object) and arm a faulthandler watchdog so a
          # hang dumps the stuck test's stack instead of an opaque CI timeout.
          # pwsh is used (not bash) so the setup-python interpreter is first on
          # PATH on Windows. Pass/fail is decided by the unittest verdict text,
          # not the interpreter exit code: CPython can return a spurious non-zero
          # code at shutdown on Windows even when every test passed.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          python python/tests/_run_suite.py 2>&1 | Tee-Object -Variable out
          $text = $out -join "`n"
          # Case-sensitive: the unittest summary is uppercase "OK" / "FAILED";
          # per-test "ok"/"...error" lines are lowercase and must not match.
          if ($text -cmatch 'FAILED' -or -not ($text -cmatch 'OK')) { exit 1 }
          exit 0

      - name: Lint and type-check Python (Linux only)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        run: |
          python -m pip install ruff mypy
          ruff check python/src/gigavector/async_api.py python/src/gigavector/pool.py python/src/gigavector/benchmark.py
          mypy python/src/gigavector/async_api.py python/src/gigavector/pool.py python/src/gigavector/benchmark.py --ignore-missing-imports --follow-imports=silent

  # ── Sanitizer build (ASAN + UBSAN, Linux only) ──────────────────────────
  sanitizers:
    name: sanitizers (ASAN + UBSAN)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libcurl4-openssl-dev \
            libssl-dev \
            libmicrohttpd-dev

      - name: Configure with sanitizers
        timeout-minutes: 10
        run: |
          cmake -S . -B build-san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF \
            -DENABLE_SANITIZERS=ON

      - name: Build
        timeout-minutes: 10
        run: cmake --build build-san --parallel

      - name: Run tests under ASAN/UBSAN
        timeout-minutes: 10
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/fuzz/lsan.supp
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-san --output-on-failure --parallel --timeout 120

  # ── ThreadSanitizer build (TSAN, Linux only) ────────────────────────────
  tsan:
    name: sanitizers (TSAN)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang \
            libcurl4-openssl-dev \
            libssl-dev \
            libmicrohttpd-dev

      - name: Build and run tests under ThreadSanitizer
        timeout-minutes: 20
        env:
          CC: clang
          TSAN_OPTIONS: halt_on_error=1
        run: make test-tsan

  # ── libFuzzer + DST (clang, Linux only) ───────────────────────────────
  fuzz:
    name: libFuzzer + DST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # Accumulating fuzz corpus. The cache dir is passed as the fuzzer's
      # FIRST (writable) corpus dir via CORPUS_CACHE, so every run keeps the
      # inputs discovered by previous runs and coverage grows monotonically
      # instead of resetting to the committed seeds each time.
      - name: Restore accumulated fuzz corpus
        uses: actions/cache/restore@v4
        with:
          path: build/fuzz/corpus-cache
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang \
            libcurl4-openssl-dev \
            libssl-dev \
            libmicrohttpd-dev

      - name: Build library
        timeout-minutes: 10
        run: make lib

      # Feed corrupted WAL + snapshot bytes to the loaders and require a defined
      # error (no crash / no silent-accept). A real exit code fails the build.
      - name: Corrupt-input resilience (WAL + snapshot)
        timeout-minutes: 10
        run: make test-corrupt-resilience

      # dst-test globs tests/dst/*.c so new DST oracles can't drift out of CI.
      - name: Run DST oracles
        timeout-minutes: 10
        run: make dst-test

      - name: Generate fuzz corpus and run fuzzers
        timeout-minutes: 15
        run: |
          make fuzz-corpus
          make fuzz-run CORPUS_CACHE=build/fuzz/corpus-cache

      # Persist whatever the run added; the mutable cache entry is rewritten
      # by the save step below (keyed on this run_id).
      - name: Save accumulated fuzz corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/fuzz/corpus-cache
          key: fuzz-corpus-${{ github.run_id }}

      # Crash / leak / OOM reproducers land in build/fuzz/crashes via
      # -artifact_prefix. Upload them so the failing input is attached to the
      # run instead of lost with the ephemeral workspace.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/fuzz/crashes/
          if-no-files-found: ignore

  # ── Formal verification: Quint specs, CBMC harnesses, lock order ───────
  #
  # Split by cost. formal-lint / quint-typecheck / quint-test / cbmc-smoke are
  # seconds and gate every push; quint-verify runs Apalache (JVM + Z3) and
  # cbmc runs bounded proofs, so both are scheduled/dispatch only.
  # See docs/formal_verification_plan.md.
  formal:
    name: formal (Quint + CBMC + lock order)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Node (Quint CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java (Apalache backend)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Quint
        run: npm install -g @informalsystems/quint

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libssl-dev libmicrohttpd-dev

      - name: Build library
        run: make lib

      # No toolchain needed: parses docs/lock_ordering.md and checks every lock
      # acquisition in src/ against it. Includes a self-test, so a broken
      # checker fails loudly instead of passing vacuously.
      - name: Lock-order static check
        run: make formal-lint

      # Every .c file under src/ must carry a verification classification, and
      # every classification must resolve to an artifact that exists. New code
      # cannot merge unverified-and-unclassified, and the manifest cannot
      # over-claim coverage it does not have.
      - name: Verification coverage manifest
        run: |
          pip install pyyaml
          make formal-coverage

      # Globs specs/quint/*.qnt so a new spec cannot drift out of CI.
      - name: Typecheck all Quint specs
        run: make quint-typecheck

      # Scenario runs and regression witnesses, including the counterexample
      # that motivated the raft.c distinct-voter fix.
      - name: Quint scenario tests
        run: make quint-test

      # Compile + concretely run the CBMC harnesses. Cheap gate that keeps them
      # from bit-rotting even when cbmc itself is not installed.
      # Vacuity gate: every spec must still be able to reach a named
      # interesting state. A dead model passes every invariant trivially.
      - name: Quint vacuity check
        run: make quint-witness

      - name: CBMC harness smoke
        run: make cbmc-smoke

      # Replay Quint-generated ITF traces against the real C implementation.
      - name: ITF trace replay vs. C
        run: |
          pip install cffi
          make quint-replay

      # Apalache symbolic model checking. Bounded (--max-steps): a pass means
      # no counterexample within the bound, not a proof.
      - name: Quint model checking (Apalache)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 25
        run: make quint-verify

      # UNBOUNDED proofs: inductive invariants hold in every initial state, are
      # preserved by every step, and imply the target -- so they hold for ALL
      # reachable states, with no step bound. Runs Apalache (JVM + Z3), so it is
      # scheduled/dispatch-only like quint-verify rather than gating every push;
      # the `auth` invariant is not yet inductive (needs strengthening lemmas).
      - name: Quint inductive invariants (unbounded)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 15
        run: make quint-induct

      # REAL bounded proofs over the C. Distinct from cbmc-smoke above, which
      # only runs each harness once concretely. run_cbmc.py reports
      # PROVED/FAILED/INTRACTABLE separately -- INTRACTABLE is not a proof.
      # z3 is required by harnesses declaring CBMC-SOLVER (e.g. grpc_frame's
      # --smt2 --fpa route); run_cbmc.py skips those cleanly if it is absent.
      - name: CBMC bounded proofs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 40
        run: |
          # Pin the exact solver build the grpc_frame proof was discharged
          # with locally (apt z3 lags and SMT2 float theory behaviour varies
          # by version). run_cbmc.py skips CBMC-SOLVER harnesses if this
          # fails, so a broken download degrades to SKIP, not ERROR.
          curl -sSL -o /tmp/z3.zip \
            https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip \
            && unzip -o /tmp/z3.zip -d /tmp/z3 \
            && sudo cp /tmp/z3/z3-5.1.0-x64-glibc-2.39/bin/z3 /usr/local/bin/
          curl -sSL -o /tmp/cbmc.deb \
            https://github.com/diffblue/cbmc/releases/download/cbmc-6.11.0/ubuntu-24.04-cbmc-6.11.0-Linux.deb
          sudo dpkg -i /tmp/cbmc.deb || sudo apt-get -f install -y
          make cbmc CBMC_TIMEOUT=300

  # ── Valgrind memcheck (curated, Linux only) ─────────────────────────────
  valgrind:
    name: valgrind (curated memcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential valgrind \
            libcurl4-openssl-dev \
            libssl-dev \
            libmicrohttpd-dev

      # Runs valgrind with --error-exitcode=1 --leak-check=full over a curated
      # set of memory-sensitive binaries. Any leak/error fails the build (unlike
      # the legacy `test-valgrind`, which ran a single binary and was swallowed).
      # SIMD_FLAGS is emptied so the binaries are built for generic x86-64 (SSE2)
      # rather than -march=native: valgrind cannot decode the AVX-512 instructions
      # GCC emits under -march=native on the runner (e.g. the inlined memset in
      # soa_storage_create), which aborts the process mid-run and shows up as a
      # spurious "definitely lost". The SIMD kernels are runtime-gated, so the
      # scalar fallback keeps behaviour identical for memory checking.
      - name: Curated valgrind memcheck
        timeout-minutes: 20
        run: make test-valgrind-core SIMD_FLAGS=

  # ── Static analysis (cppcheck, Linux only) ──────────────────────────────
  static-analysis:
    name: static analysis (cppcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Install cppcheck
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        timeout-minutes: 20
        run: |
          set -o pipefail
          cppcheck \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=nullPointerRedundantCheck:src/features/cypher.c \
            --suppress=uninitvar:src/features/cypher.c \
            -I include \
            src/ 2>&1 | tee cppcheck-report.txt

      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: cppcheck-report
          path: cppcheck-report.txt

  # ── Strict-warnings build (-Werror, Linux only) ─────────────────────────
  strict-warnings:
    name: strict warnings (-Werror)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcurl4-openssl-dev \
            libssl-dev \
            libmicrohttpd-dev

      # Builds the library with -Werror on top of -Wall -Wextra so any NEW
      # warning fails CI. Opt-in target; not part of the default build.
      - name: Build library with -Werror
        timeout-minutes: 10
        run: make strict

  # ── Coverage gate (Linux only) ──────────────────────────────────────────
  coverage-gate:
    name: coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcurl4-openssl-dev \
            libssl-dev \
            libmicrohttpd-dev \
            lcov

      # Fails the job when line coverage drops below COVERAGE_MIN_LINES.
      # Ratchet this up as coverage improves; do not lower it.
      - name: Run tests with coverage and enforce threshold
        timeout-minutes: 50
        env:
          COVERAGE_MIN_LINES: "40"
        run: |
          make test-coverage
          lcov --summary build/coverage.info --fail-under-lines "$COVERAGE_MIN_LINES"

  # ── clang-tidy (Linux only, report-only) ────────────────────────────────
  clang-tidy:
    name: static analysis (clang-tidy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang-tidy \
            libcurl4-openssl-dev \
            libssl-dev \
            libmicrohttpd-dev

      - name: Run clang-tidy
        timeout-minutes: 30
        run: |
          set -o pipefail
          # Check set lives in the repo's .clang-tidy (curated, documented there).
          # Source files must come BEFORE `--` (everything after it is compiler
          # flags); run in parallel to stay within the timeout.
          find src -name '*.c' -print0 | sort -z | \
            xargs -0 -n 8 -P "$(nproc)" sh -c \
              'clang-tidy --quiet --warnings-as-errors="*" "$@" -- -Iinclude -std=c11 -D_GNU_SOURCE' _ \
            2>&1 | tee clang-tidy-report.txt
          echo "clang-tidy findings: $(grep -c 'warning:' clang-tidy-report.txt || true)"

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: clang-tidy-report
          path: clang-tidy-report.txt

  # ── Go client (cgo, embedded; Linux only) ─────────────────────────────
  go-client:
    name: Go client (cgo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcurl4-openssl-dev \
            libssl-dev \
            libmicrohttpd-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build C library
        run: make lib

      - name: Build and test Go client
        working-directory: clients/go
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib
        run: |
          go vet ./...
          go test -v ./...
