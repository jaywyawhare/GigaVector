apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gigavector.fullname" . }}
  labels:
    {{- include "gigavector.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "gigavector.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gigavector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gigavector.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: gigavector
          image: {{ include "gigavector.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
          env:
            - name: GV_PORT
              value: {{ .Values.server.port | quote }}
            - name: GV_DATA_DIR
              value: /data
            - name: GV_DIMENSION
              value: {{ .Values.server.dimension | quote }}
            - name: GV_INDEX
              value: {{ .Values.server.index | quote }}
            - name: GV_THREADS
              value: {{ .Values.server.threads | quote }}
            {{- if .Values.server.apiKey }}
            - name: GV_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gigavector.fullname" . }}-auth
                  key: api-key
            {{- else if .Values.server.allowUnauthenticated }}
            - name: GV_ALLOW_UNAUTH
              value: "1"
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if not .Values.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
