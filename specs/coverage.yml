  exempt:
    - ref: "-"
      why: "delegates to external identity/TLS providers; correctness is the provider's"
      files:
        - admin/sso.c
        - security/tls.c
    - ref: "-"
      why: "observability and configuration plumbing; no state machine or memory-safety surface beyond compiler checks"
      files:
        - admin/otlp.c
        - admin/tracing.c
        - core/config.c
        - core/log.c
    - ref: "-"
      why: "thin bindings to external runtimes (ONNX, LLM APIs, CUDA); no independently verifiable logic"
      files:
        - multimodal/inference.c
        - multimodal/llm.c
        - multimodal/onnx.c
        - specialized/embedded.c
        - specialized/gpu.c
