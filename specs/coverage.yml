# Verification coverage manifest.
#
# Every .c file under src/ must appear exactly once. scripts/check_coverage.py
# fails the build if a file is added without a classification, so new code
# cannot silently escape verification.
#
# Tiers:
#   quint    - modelled by a Quint spec in specs/quint/ (design-level model checking)
#   cbmc     - bounded proof over the real C, DISCHARGED. Only files whose
#              harness actually returned VERIFICATION SUCCESSFUL appear here.
#   cbmc-pending - a harness exists and is wired up, but does not currently
#              discharge (INTRACTABLE / FAILED / ERROR / SKIP). This is honest
#              work-in-progress, NOT verification, and is counted separately.
#   property - statistical or algorithmic; covered by property/differential tests,
#              NOT formally verified. Recorded so the gap is explicit.
#   exempt   - deliberately out of scope, with a stated reason.

tiers:
  quint:
    - ref: "ab_test.qnt"
      why: "deterministic bucketing, stable assignment"
      files:
        - admin/ab_test.c
        - specialized/conditional.c
    - ref: "auth.qnt"
      why: "token lifecycle, expiry, no privilege retention"
      files:
        - security/auth.c
    - ref: "bulk_import.qnt"
      why: "all-or-nothing batch, partial-failure visibility"
      files:
        - storage/bulk_import.c
        - storage/document_ingest.c
    - ref: "cache.qnt"
      why: "cache coherence, no stale-after-invalidate"
      files:
        - admin/cache.c
        - storage/disk_page_cache.c
    - ref: "cdc.qnt"
      why: "delivery prefix, no phantom event"
      files:
        - admin/cdc.c
        - admin/streaming.c
    - ref: "cluster.qnt"
      why: "membership, quorum health"
      files:
        - admin/cluster.c
    - ref: "consistency.qnt"
      why: "session guarantees, bounded staleness"
      files:
        - search/consistency.c
        - search/freshness.c
    - ref: "dedup.qnt"
      why: "id uniqueness, dedup idempotence"
      files:
        - specialized/dedup.c
        - specialized/point_id.c
    - ref: "index_swap.qnt"
      why: "online rebuild, no lost insert"
      files:
        - index/index_maintenance.c
        - index/ivf_retrain.c
    - ref: "lock_order.qnt"
      why: "lock hierarchy; also covered by scripts/check_lock_order.py"
      files:
